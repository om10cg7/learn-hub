<title>etc — どこにも振り分けられない投稿の要約集</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; background: #f7f7f5; color: #222; }

  .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e3e3de; border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .card .author { font-size: 13px; color: #888; margin: 0 0 8px; }

  .card .links { font-size: 14px; margin: 0; }
  .card .links a { color: #2563eb; text-decoration: none; margin-right: 12px; }
  .card .links a:hover { text-decoration: underline; }
  .empty { background: #fff; border: 1px dashed #ccc; border-radius: 12px; padding: 32px 20px; text-align: center; color: #777; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

      <p class="author">作者名</p>

      <p class="links"><a href="元の投稿URL">元の投稿</a><a href="notes/ノートファイル名.md">ノート</a></p>
    </article>
  -->

  <div class="list">
  </div>

    <p>まだありません。<br>どこにも振り分けられない投稿が来たら、ここに要約が追加されていきます。</p>
  </div>
</div>
